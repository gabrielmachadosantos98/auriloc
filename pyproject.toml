[project]
name = "acess-iphone"
version = "0.1.0"
description = "Simula a localização de um iPhone conectado via USB (Windows, iOS 17.4+)."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.165.0",
    "pymobiledevice3>=11.65.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
iphone-gps = "acess_iphone.cli:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
