<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auriloc</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root {
    --bg: #ffffff;
    --fg: #1f2328;
    --muted: #656d76;
    --border: #d8dee4;
    --soft: #f3f5f7;
    --accent: #2563eb;
    --accent-fg: #ffffff;
    --danger: #c2410c;
    --ok: #16a34a;
    --warn: #ca8a04;
    --shadow: 0 6px 24px rgba(0, 0, 0, .14);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1f24; --fg: #e6e8eb; --muted: #9aa3ad; --border: #343a42;
      --soft: #262a30; --accent: #4f8cff; --danger: #fb923c; --shadow: 0 6px 24px rgba(0, 0, 0, .5);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #map { position: fixed; inset: 0; }
  .leaflet-container { cursor: crosshair; }

  .panel { position: fixed; top: 16px; left: 16px; z-index: 1000; width: 340px; max-height: calc(100% - 32px);
    overflow-y: auto; background: var(--bg); border: 1px solid var(--border); border-radius: 14px;
    box-shadow: var(--shadow); padding: 16px; display: flex; flex-direction: column; gap: 14px; }
  @media (max-width: 600px) {
    .panel { top: auto; bottom: 0; left: 0; width: 100%; max-height: 55%; border-radius: 14px 14px 0 0; }
  }
  h1 { font-size: 16px; margin: 0; }
  .device { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.err { background: var(--danger); }

  .tabs { display: grid; grid-template-columns: 1fr 1fr; background: var(--soft); border-radius: 10px; padding: 3px; }
  .tabs button { border: 0; background: transparent; color: var(--muted); padding: 7px; border-radius: 8px;
    font: inherit; font-weight: 600; cursor: pointer; }
  .tabs button.active { background: var(--bg); color: var(--fg); box-shadow: 0 1px 3px rgba(0,0,0,.12); }

  .hint { color: var(--muted); font-size: 13px; margin: 0; }
  .row { display: flex; gap: 8px; align-items: center; }
  input[type=text], input[type=number] { flex: 1; min-width: 0; padding: 8px 10px; border: 1px solid var(--border);
    border-radius: 8px; background: var(--bg); color: var(--fg); font: inherit; }
  button.btn { border: 1px solid var(--border); background: var(--soft); color: var(--fg); padding: 8px 12px;
    border-radius: 8px; font: inherit; font-weight: 600; cursor: pointer; white-space: nowrap; }
  button.btn:hover:not(:disabled) { filter: brightness(.96); }
  button.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  button.btn.danger { color: var(--danger); }
  button.btn:disabled { opacity: .45; cursor: default; }
  .grow { flex: 1; }

  .modes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .mode { border: 1px solid var(--border); background: var(--bg); color: var(--fg); border-radius: 10px;
    padding: 6px 2px; font: inherit; font-size: 12px; cursor: pointer; display: flex; flex-direction: column;
    align-items: center; gap: 2px; }
  .mode .ico { font-size: 18px; line-height: 1; }
  .mode.active { border-color: var(--accent); color: var(--accent); font-weight: 600; box-shadow: inset 0 0 0 1px var(--accent); }
  .check { display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; }
  .check input { width: 16px; height: 16px; accent-color: var(--accent); }
  .plan-state { font-size: 12px; color: var(--muted); min-height: 16px; }
  .plan-state.error { color: var(--danger); }
  label.small { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }

  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stat { background: var(--soft); border-radius: 8px; padding: 8px 10px; }
  .stat b { display: block; font-size: 15px; }
  .stat span { color: var(--muted); font-size: 12px; }

  .progress { height: 6px; background: var(--soft); border-radius: 3px; overflow: hidden; }
  .progress > div { height: 100%; width: 0; background: var(--accent); transition: width .4s; }

  .now { border-top: 1px solid var(--border); padding-top: 12px; display: flex; flex-direction: column; gap: 10px; }
  .coords { font-variant-numeric: tabular-nums; font-size: 13px; cursor: pointer; }
  .coords:hover { color: var(--accent); }

  .toast { position: fixed; z-index: 1100; left: 50%; bottom: 24px; transform: translateX(-50%); max-width: min(560px, calc(100% - 32px));
    background: var(--fg); color: var(--bg); padding: 10px 14px; border-radius: 10px; box-shadow: var(--shadow);
    font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .2s; white-space: pre-line; }
  .toast.show { opacity: 1; }
  .toast.error { background: var(--danger); color: #fff; }
  .hidden { display: none !important; }

  /* Sprite that travels the route on the map, one per travel mode. */
  .rider-icon { background: none; border: 0; }
  .rider { position: relative; width: 44px; height: 44px; }
  .rider-badge { width: 44px; height: 44px; border-radius: 50%; background: var(--bg); border: 3px solid var(--accent);
    box-shadow: var(--shadow); display: flex; align-items: center; justify-content: center; }
  .rider-emoji { display: inline-block; font-size: 24px; line-height: 1; transition: transform .25s;
    font-family: "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif; }
  .rider.east .rider-emoji { transform: scaleX(-1); } /* sprites face left; mirror when heading east */
  .rider-speed { position: absolute; top: 47px; left: 50%; transform: translateX(-50%); white-space: nowrap;
    background: var(--fg); color: var(--bg); font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 999px;
    font-variant-numeric: tabular-nums; }
  .rider:not(.moving) .rider-speed { display: none; }
  .rider.moving .rider-badge { animation: bob var(--bob-time, .5s) ease-in-out infinite; }
  .rider.walking { --bob-time: .6s; --bob-y: -3px; }
  .rider.running { --bob-time: .32s; --bob-y: -4px; }
  .rider.cycling { --bob-time: .4s; --bob-y: -1.5px; }
  .rider.driving { --bob-time: .2s; --bob-y: -1px; }
  @keyframes bob { 50% { transform: translateY(var(--bob-y, -2px)); } }
  @media (prefers-reduced-motion: reduce) { .rider.moving .rider-badge { animation: none; } }
</style>
</head>
<body>
<div id="map"></div>

<aside class="panel">
  <div>
    <h1>Auriloc</h1>
    <div class="device"><span id="dot" class="dot"></span><span id="deviceText">Connecting…</span></div>
  </div>

  <div class="tabs" role="tablist">
    <button id="tabPoint" class="active" role="tab">Fixed point</button>
    <button id="tabRoute" role="tab">Route</button>
  </div>

  <section id="pointPane" style="display:flex;flex-direction:column;gap:10px">
    <p class="hint">Click the map to teleport the iPhone there.</p>
    <form id="coordForm" class="row">
      <input id="coordInput" type="text" placeholder="-23.5505, -46.6333" autocomplete="off">
      <button class="btn" type="submit">Go</button>
    </form>
  </section>

  <section id="routePane" class="hidden" style="display:flex;flex-direction:column;gap:10px">
    <p class="hint">Click the map to add route points, in travel order.</p>
    <div class="row">
      <button id="undoBtn" class="btn grow">Undo point</button>
      <button id="resetBtn" class="btn grow">Clear route</button>
    </div>
    <label class="small">Travel mode</label>
    <div class="modes" id="modeButtons">
      <button class="mode" data-mode="walking" data-speed="5" title="Walking, 5 km/h"><span class="ico">🚶</span>Walk</button>
      <button class="mode" data-mode="running" data-speed="10" title="Running, 10 km/h"><span class="ico">🏃</span>Run</button>
      <button class="mode" data-mode="cycling" data-speed="18" title="Cycling, 18 km/h"><span class="ico">🚴</span>Bike</button>
      <button class="mode" data-mode="driving" data-speed="40" title="Driving, 40 km/h"><span class="ico">🚗</span>Car</button>
    </div>
    <label class="check"><input id="streetsInput" type="checkbox" checked> Follow real streets</label>
    <label class="small" for="speedInput">Cruise speed (km/h)</label>
    <input id="speedInput" type="number" min="1" max="300" step="1" value="5">
    <p class="hint">Starts from rest, slows down for turns and stops at the end, like a real trip.</p>
    <div id="planState" class="plan-state"></div>
    <div class="stats">
      <div class="stat"><b id="distStat">0 m</b><span>distance</span></div>
      <div class="stat"><b id="timeStat">0 s</b><span>estimated time</span></div>
    </div>
    <div class="row">
      <button id="playBtn" class="btn primary grow" disabled>Start route</button>
      <button id="stopBtn" class="btn grow" disabled>Stop</button>
    </div>
    <div id="progressWrap" class="hidden" style="display:flex;flex-direction:column;gap:4px">
      <div class="progress"><div id="progressBar"></div></div>
      <span id="progressText" class="hint"></span>
      <label class="check"><input id="followInput" type="checkbox" checked> Follow on map</label>
    </div>
  </section>

  <section class="now">
    <div class="row">
      <span class="grow">
        <label class="small">Simulated location</label><br>
        <span id="currentText" class="coords" title="Center on map">None (real GPS)</span>
      </span>
    </div>
    <button id="clearBtn" class="btn danger">Back to real GPS</button>
  </section>
</aside>

<div id="toast" class="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const $ = (id) => document.getElementById(id);

// ---------- map ----------
const map = L.map('map', { zoomControl: false }).setView([-23.5505, -46.6333], 14);
L.control.zoom({ position: 'bottomright' }).addTo(map);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
}).addTo(map);

const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#2563eb';
const draftLine = L.polyline([], { color: accent, weight: 3, dashArray: '6 8', opacity: .6 }).addTo(map);
const plannedLine = L.polyline([], { color: accent, weight: 5, opacity: .9 }).addTo(map);
const draftDots = L.layerGroup().addTo(map);
const activeLine = L.polyline([], { color: accent, weight: 5, opacity: .35 }).addTo(map);
const currentMarker = L.circleMarker([0, 0], {
  radius: 9, color: '#fff', weight: 3, fillColor: accent, fillOpacity: 1,
});

// ---------- state ----------
let mode = 'point';
let waypoints = [];
let travelMode = 'walking';
let plan = null; // server preview of the current draft: { path, length_m, duration_s }
let planSeq = 0;
let planTimer;
let status = null;
let busy = false;
let centeredOnce = false;

// ---------- travelling sprite ----------
const SPRITES = { walking: '🚶', running: '🏃', cycling: '🚴', driving: '🚗' };
let rider = null; // { marker, mode, shown, from, to, t0, dur, done, east, animating }
let follow = true;

function riderIcon(m) {
  return L.divIcon({
    className: 'rider-icon', iconSize: [44, 44], iconAnchor: [22, 22],
    html: `<div class="rider ${m}"><div class="rider-badge"><span class="rider-emoji">${SPRITES[m]}</span></div>`
      + `<div class="rider-speed"></div></div>`,
  });
}

// Map center that puts `latlng` in the middle of the part of the map the panel doesn't cover.
function followCenter(latlng) {
  const r = document.querySelector('.panel').getBoundingClientRect();
  const shift = window.innerWidth <= 600 ? L.point(0, r.height / 2) : L.point(-r.right / 2, 0);
  const z = map.getZoom();
  return map.unproject(map.project(latlng, z).add(shift), z);
}

// Glide between the 1-per-second positions so the sprite walks instead of jumping.
function animateRider(now) {
  if (!rider) return;
  const f = rider.dur > 0 ? Math.min(1, (now - rider.t0) / rider.dur) : 1;
  rider.shown = [rider.from[0] + (rider.to[0] - rider.from[0]) * f, rider.from[1] + (rider.to[1] - rider.from[1]) * f];
  rider.marker.setLatLng(rider.shown);
  if (follow && status?.mode === 'route') map.panTo(followCenter(rider.shown), { animate: false });
  if (f < 1) requestAnimationFrame(animateRider);
  else rider.animating = false;
}

function updateRider(s) {
  const show = !!(s?.current && s.travel_mode && SPRITES[s.travel_mode] && s.mode !== 'idle');
  if (!show) {
    if (rider) { rider.marker.remove(); rider = null; }
    return false;
  }
  const target = s.current;
  const done = s.progress?.done ?? null;
  if (!rider || rider.mode !== s.travel_mode) {
    rider?.marker.remove();
    rider = {
      marker: L.marker(target, { icon: riderIcon(s.travel_mode), interactive: false, keyboard: false, zIndexOffset: 1000 }).addTo(map),
      mode: s.travel_mode, shown: target, from: target, to: target, t0: 0, dur: 0, done, east: false, speed: 0, animating: false,
    };
    if (follow && s.mode === 'route') {
      map.setZoom(Math.max(map.getZoom(), 17), { animate: false });
      map.panTo(followCenter(target), { animate: false });
    }
  } else if (target[0] !== rider.to[0] || target[1] !== rider.to[1]) {
    // How many route steps passed since the last position we saw (usually 1).
    const steps = done != null && rider.done != null && done > rider.done ? done - rider.done : 1;
    const dt = steps * (s.interval_s || 1);
    rider.speed = (L.latLng(rider.to).distanceTo(L.latLng(target)) / dt) * 3.6;
    if (Math.abs(target[1] - rider.to[1]) > 1e-7) rider.east = target[1] > rider.to[1];
    rider.from = rider.shown;
    rider.to = target;
    rider.t0 = performance.now();
    rider.dur = Math.min(dt, 2) * 1000;
    if (!rider.animating) { rider.animating = true; requestAnimationFrame(animateRider); }
  }
  rider.done = done;

  const el = rider.marker.getElement()?.querySelector('.rider');
  if (el) {
    const moving = s.mode === 'route' && rider.speed >= 0.5;
    el.classList.toggle('moving', moving);
    el.classList.toggle('east', rider.east);
    el.querySelector('.rider-speed').textContent = `${Math.round(rider.speed)} km/h`;
  }
  return true;
}

// ---------- utilities ----------
let toastTimer;
function toast(msg, isError = false) {
  const el = $('toast');
  el.textContent = msg;
  el.className = 'toast show' + (isError ? ' error' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (el.className = 'toast'), isError ? 7000 : 2500);
}

function formatDetail(detail) {
  if (!detail) return '';
  if (typeof detail === 'string') return detail;
  if (Array.isArray(detail)) return detail.map((d) => d.msg).join('\n');
  return JSON.stringify(detail);
}

async function api(path, body) {
  const opts = body === undefined ? {} : {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
  };
  const res = await fetch(path, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(formatDetail(data.detail) || `Error ${res.status}`);
  return data;
}

async function command(path, body, okMsg) {
  if (busy) return;
  busy = true; render();
  try {
    status = await api(path, body);
    if (okMsg) toast(okMsg);
  } catch (e) {
    toast(e.message, true);
  } finally {
    busy = false; render();
  }
}

const fmtCoord = (p) => `${p[0].toFixed(6)}, ${p[1].toFixed(6)}`;
function fmtDist(m) { return m < 1000 ? `${Math.round(m)} m` : `${(m / 1000).toFixed(2)} km`; }
function fmtTime(s) {
  s = Math.round(s);
  if (s < 60) return `${s} s`;
  const m = Math.floor(s / 60), r = s % 60;
  if (m < 60) return `${m} min ${r ? r + ' s' : ''}`.trim();
  return `${Math.floor(m / 60)} h ${m % 60} min`;
}
function lengthOf(points) {
  let d = 0;
  for (let i = 1; i < points.length; i++) d += L.latLng(points[i - 1]).distanceTo(L.latLng(points[i]));
  return d;
}
const speed = () => Number($('speedInput').value);

// ---------- interaction ----------
function setMode(m) {
  mode = m;
  $('tabPoint').classList.toggle('active', m === 'point');
  $('tabRoute').classList.toggle('active', m === 'route');
  $('pointPane').classList.toggle('hidden', m !== 'point');
  $('routePane').classList.toggle('hidden', m !== 'route');
  render();
}
$('tabPoint').onclick = () => setMode('point');
$('tabRoute').onclick = () => setMode('route');

map.on('click', (e) => {
  const p = [e.latlng.lat, e.latlng.lng];
  if (mode === 'point') {
    command('/api/location', { lat: p[0], lon: p[1] }, `iPhone at ${fmtCoord(p)}`);
  } else {
    waypoints.push(p);
    renderDraft();
  }
});

$('coordForm').onsubmit = (e) => {
  e.preventDefault();
  const m = $('coordInput').value.trim().match(/^(-?\d+(?:\.\d+)?)\s*[,;\s]\s*(-?\d+(?:\.\d+)?)$/);
  if (!m) { toast('Use the "latitude, longitude" format, e.g. -23.5505, -46.6333', true); return; }
  const p = [Number(m[1]), Number(m[2])];
  map.setView(p, Math.max(map.getZoom(), 16));
  command('/api/location', { lat: p[0], lon: p[1] }, `iPhone at ${fmtCoord(p)}`);
};

$('undoBtn').onclick = () => { waypoints.pop(); renderDraft(); };
$('resetBtn').onclick = () => { waypoints = []; renderDraft(); };

$('modeButtons').onclick = (e) => {
  const btn = e.target.closest('.mode');
  if (!btn) return;
  travelMode = btn.dataset.mode;
  $('speedInput').value = btn.dataset.speed;
  renderDraft();
};
$('speedInput').oninput = renderDraft;
$('streetsInput').onchange = renderDraft;

const routeBody = () => ({
  points: waypoints.map(([lat, lon]) => ({ lat, lon })),
  speed_kmh: speed(),
  travel_mode: travelMode,
  follow_streets: $('streetsInput').checked,
});

// Ask the server how the route will really go (along streets, with turns and stops).
function schedulePlan() {
  clearTimeout(planTimer);
  plan = null;
  const seq = ++planSeq;
  if (waypoints.length < 2 || !(speed() > 0)) { setPlanState(''); return; }
  setPlanState($('streetsInput').checked ? 'Finding the way along the streets…' : 'Planning…');
  planTimer = setTimeout(async () => {
    try {
      const result = await api('/api/route/plan', routeBody());
      if (seq !== planSeq) return; // a newer draft replaced this one
      plan = result;
      setPlanState('');
    } catch (e) {
      if (seq !== planSeq) return;
      setPlanState(e.message, true);
    }
    renderPlan();
  }, 350);
}
function setPlanState(text, isError = false) {
  $('planState').textContent = text;
  $('planState').className = 'plan-state' + (isError ? ' error' : '');
}

$('playBtn').onclick = () => {
  if (waypoints.length < 2 || !(speed() > 0)) return;
  const label = { walking: 'Walking', running: 'Running', cycling: 'Cycling', driving: 'Driving' }[travelMode];
  follow = true;
  $('followInput').checked = true;
  command('/api/route', routeBody(), `${label} route started`);
};
$('stopBtn').onclick = () => command('/api/stop', {}, 'Route stopped; iPhone held at the current point');
$('clearBtn').onclick = () => command('/api/clear', {}, 'iPhone back on real GPS');
$('followInput').onchange = () => {
  follow = $('followInput').checked;
  if (follow && rider) map.panTo(followCenter(rider.shown));
};
// Dragging the map while following means the user wants to look elsewhere.
map.on('dragstart', () => {
  if (follow && status?.mode === 'route') { follow = false; $('followInput').checked = false; }
});
$('currentText').onclick = () => { if (status?.current) map.setView(status.current, Math.max(map.getZoom(), 16)); };

// ---------- rendering ----------
function renderDraft() {
  draftLine.setLatLngs(waypoints);
  draftDots.clearLayers();
  waypoints.forEach((p, i) => {
    L.circleMarker(p, {
      radius: i === 0 || i === waypoints.length - 1 ? 6 : 4, color: accent, weight: 2,
      fillColor: i === 0 ? accent : '#fff', fillOpacity: 1,
    }).addTo(draftDots);
  });
  [...$('modeButtons').children].forEach((b) => b.classList.toggle('active', b.dataset.mode === travelMode));
  schedulePlan();
  renderPlan();
}

function renderPlan() {
  plannedLine.setLatLngs(plan ? plan.path : []);
  const d = plan ? plan.length_m : lengthOf(waypoints);
  const approx = !plan && waypoints.length >= 2;
  $('distStat').textContent = (approx ? '~' : '') + fmtDist(d);
  $('timeStat').textContent = plan ? fmtTime(plan.duration_s)
    : speed() > 0 ? (approx ? '~' : '') + fmtTime(d / (speed() / 3.6)) : '—';
  render();
}

function render() {
  const s = status;
  const dot = $('dot');
  if (!s) {
    dot.className = 'dot warn';
    $('deviceText').textContent = 'Server not responding';
  } else if (s.connected && s.device) {
    dot.className = 'dot ok';
    $('deviceText').textContent = `${s.device.name ?? 'iPhone'} · iOS ${s.device.ios_version}`;
  } else if (s.connecting) {
    dot.className = 'dot warn';
    $('deviceText').textContent = 'Connecting to the iPhone…';
  } else {
    dot.className = 'dot err';
    $('deviceText').textContent = s.error || 'iPhone disconnected';
  }

  const running = s?.mode === 'route';
  $('playBtn').disabled = busy || waypoints.length < 2 || !(speed() > 0);
  $('stopBtn').disabled = busy || !running;
  $('clearBtn').disabled = busy;
  $('playBtn').textContent = running ? 'Restart route' : 'Start route';

  const riderShown = updateRider(s);
  if (s?.current) {
    currentMarker.setLatLng(s.current);
    if (riderShown) currentMarker.remove();
    else if (!map.hasLayer(currentMarker)) currentMarker.addTo(map);
    $('currentText').textContent = fmtCoord(s.current) + (running ? '  (moving)' : '');
    if (!centeredOnce) { map.setView(s.current, 16); centeredOnce = true; }
  } else {
    if (map.hasLayer(currentMarker)) currentMarker.remove();
    $('currentText').textContent = 'None (real GPS)';
  }

  activeLine.setLatLngs(running && s.route ? s.route : []);
  const showProgress = running && s.progress;
  $('progressWrap').classList.toggle('hidden', !showProgress);
  if (showProgress) {
    const { done, total } = s.progress;
    $('progressBar').style.width = `${(100 * done) / total}%`;
    const left = (total - done) * s.interval_s;
    $('progressText').textContent = `${done} of ${total} points · ${fmtTime(left)} left`;
  }
}

async function poll() {
  try {
    status = await api('/api/status');
  } catch {
    status = null;
  }
  if (!busy) render();
  // Poll faster during a route so the sprite sees every 1-second step.
  setTimeout(poll, status?.mode === 'route' ? 400 : 1000);
}

renderDraft();
poll();
</script>
</body>
</html>
